<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="circle">
      <circle cx="150" cy="150" r="140"/>
    </clipPath>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#0d1b3e"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1b3e"/>
      <stop offset="100%" stop-color="#060c1a"/>
    </linearGradient>
    <marker id="arrowStart" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto-start-reverse">
      <path d="M7,1 L2,4 L7,7" stroke="white" stroke-width="1.2" fill="none" opacity="0.6"/>
    </marker>
    <marker id="arrowEnd" markerWidth="8" markerHeight="8" refX="3" refY="4" orient="auto">
      <path d="M1,1 L6,4 L1,7" stroke="white" stroke-width="1.2" fill="none" opacity="0.6"/>
    </marker>
  </defs>

  <circle cx="150" cy="150" r="140" fill="url(#skyGrad)"/>
  <rect x="10" y="162" width="280" height="128" fill="url(#groundGrad)" clip-path="url(#circle)"/>

  <g clip-path="url(#circle)" opacity="0.3">
    <line x1="150" y1="162" x2="10" y2="290" stroke="white" stroke-width="0.8"/>
    <line x1="150" y1="162" x2="60" y2="290" stroke="white" stroke-width="0.8"/>
    <line x1="150" y1="162" x2="110" y2="290" stroke="white" stroke-width="0.8"/>
    <line x1="150" y1="162" x2="150" y2="290" stroke="white" stroke-width="0.8"/>
    <line x1="150" y1="162" x2="190" y2="290" stroke="white" stroke-width="0.8"/>
    <line x1="150" y1="162" x2="240" y2="290" stroke="white" stroke-width="0.8"/>
    <line x1="150" y1="162" x2="290" y2="290" stroke="white" stroke-width="0.8"/>
    <line x1="10" y1="188" x2="290" y2="188" stroke="white" stroke-width="0.8"/>
    <line x1="10" y1="218" x2="290" y2="218" stroke="white" stroke-width="0.8"/>
    <line x1="10" y1="252" x2="290" y2="252" stroke="white" stroke-width="0.8"/>
  </g>

  <line x1="10" y1="162" x2="290" y2="162" stroke="white" stroke-width="1.5" clip-path="url(#circle)" opacity="0.9"/>
  <path d="M106 162 A44 44 0 0 1 194 162" fill="white" clip-path="url(#circle)"/>

  <path d="M65 95 A105 105 0 0 1 235 95"
    stroke="white" stroke-width="1.4" fill="none"
    stroke-dasharray="5 4" opacity="0.5"
    marker-start="url(#arrowStart)"
    marker-end="url(#arrowEnd)"
    clip-path="url(#circle)"/>

  <circle cx="150" cy="150" r="140" stroke="#1e3a6e" stroke-width="2" fill="none"/>
  <circle cx="150" cy="150" r="145" stroke="#0d1b3e" stroke-width="1" fill="none" opacity="0.4"/>
</svg>
